# Upstart job: take over the screen shortly after the Kindle UI boots.
# Skip by creating /mnt/us/sky/DISABLED (over USB), or for this boot via `run.sh stop`.
description "Kindle sky frame: everything above the house"
start on started lab126_gui
task
script
    [ -f /mnt/us/sky/DISABLED ] && exit 0
    [ -f /tmp/sky.stopped ] && exit 0
    sleep 45
    sh /mnt/us/sky/run.sh
end script
