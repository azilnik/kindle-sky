# Upstart job: take over the screen shortly after the Kindle UI boots.
# Skip by creating /mnt/us/planes/DISABLED (over USB), or for this boot via `run.sh stop`.
description "Kindle frame: the planes or the sky overhead"
start on started lab126_gui
task
script
    [ -f /mnt/us/planes/DISABLED ] && exit 0
    [ -f /tmp/planes.stopped ] && exit 0
    sleep 45
    sh /mnt/us/planes/run.sh
end script
